upstream gsh_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Static assets only. This is a cap so a misconfigured origin cannot serve a
# build for nine hours, and it never covers HTML, so no stale page can be cached.
proxy_cache_path /var/cache/nginx/gsh levels=1:2 keys_zone=gsh_assets:32m
                 max_size=512m inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name globalscholarshiphub.com www.globalscholarshiphub.com;

    # certbot rewrites this block when it issues the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name globalscholarshiphub.com www.globalscholarshiphub.com;

    ssl_certificate     /etc/letsencrypt/live/globalscholarshiphub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalscholarshiphub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/rss+xml;

    location /_next/static/ {
        proxy_pass http://gsh_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache gsh_assets;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://gsh_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
